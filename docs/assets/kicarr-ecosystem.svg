<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">KiCARR component ecosystem</title>
  <desc id="desc">KIA, KMFDM, and KML feed distinct library-management capabilities into the future KiCARR desktop companion.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#edf5fb"/>
    </linearGradient>
    <linearGradient id="kicarr" x1="0" x2="1">
      <stop offset="0" stop-color="#17324d"/>
      <stop offset="1" stop-color="#245b78"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52758d"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#17324d" flood-opacity=".14"/>
    </filter>
  </defs>

  <rect width="1200" height="430" rx="24" fill="#ffffff"/>
  <text x="60" y="54" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#17324d">KiCARR component ecosystem</text>
  <text x="60" y="84" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5b6f7f">Distinct tools today; a cohesive KiCad library companion over time.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="120" width="260" height="80" rx="14" fill="url(#panel)" stroke="#5b98bd" stroke-width="2"/>
    <rect x="60" y="220" width="260" height="80" rx="14" fill="url(#panel)" stroke="#5b98bd" stroke-width="2"/>
    <rect x="60" y="320" width="260" height="80" rx="14" fill="url(#panel)" stroke="#5b98bd" stroke-width="2"/>
  </g>

  <text x="84" y="153" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#17324d">KIA</text>
  <text x="84" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#425e70">Import, name, preview</text>

  <text x="84" y="253" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#17324d">KMFDM</text>
  <text x="84" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#425e70">Audit, edit, manage</text>

  <text x="84" y="353" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#17324d">KML</text>
  <text x="84" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#425e70">Look up, enrich, preview</text>

  <path d="M320 160 C470 160, 500 205, 640 225" fill="none" stroke="#52758d" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M320 260 C470 260, 520 260, 640 260" fill="none" stroke="#52758d" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M320 360 C470 360, 500 315, 640 280" fill="none" stroke="#52758d" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="670" y="155" width="460" height="205" rx="24" fill="url(#kicarr)"/>
  </g>
  <text x="720" y="218" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#ffffff">KiCARR</text>
  <text x="720" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#dcecf6">Future cohesive desktop companion</text>
  <line x1="720" y1="276" x2="1080" y2="276" stroke="#79a9c4" stroke-width="2"/>
  <text x="720" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#ffffff">Queue - Library - Audit - Changes</text>
  <text x="720" y="338" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#ffffff">History - Settings - Provider previews</text>
</svg>
